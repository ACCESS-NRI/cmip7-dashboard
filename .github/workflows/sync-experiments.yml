name: Sync Experiment UUIDs to Tracking Services database

on:
  push:
    branches: [main]
    paths:
      - "public/experiment-config.json"
  # Allow manual triggering of the workflow
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - run: pip install requests

      - name: Sync experiments
        env:
          TS_API_BASE_URL: ${{ secrets.TS_API_BASE_URL }}
          TS_API_TOKEN: ${{ secrets.TS_API_TOKEN }}
        run: python .github/scripts/sync_experiments.py