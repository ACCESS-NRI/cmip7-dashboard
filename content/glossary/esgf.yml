term: ESGF
expansion: Earth System Grid Federation
short: The distributed data archive where CMIP model output is published and downloaded.
long: >-
  ESGF is a federation of data servers around the world that together host climate
  model output, including all CMIP data. The "published" count on this dashboard
  (e.g. "1/1"), reflects how many of an experiment's ensemble members have at least
  some output uploaded to that archive — it doesn't mean every variable or file for
  that member has been published yet, just that the experiment has started landing
  on ESGF and is partially available to download and analyse.
links:
  - title: "Earth System Grid Federation"
    url: "https://esgf.llnl.gov/"
